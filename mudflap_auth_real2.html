<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mudflap — Driver Auth Code Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #00BA7F;
      --green-dark:  #009969;
      --green-light: #e6f9f3;
      --bg:          #f4f6f9;
      --surface:     #ffffff;
      --border:      #e2e8f0;
      --text:        #1a2332;
      --muted:       #64748b;
      --danger:      #ef4444;
      --radius:      12px;
      --shadow:      0 2px 16px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    header .badge {
      background: var(--green-light);
      color: var(--green-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid var(--green);
    }

    /* ── Page layout ── */
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    h1 span { color: var(--green); }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 16px;
    }

    /* ── Form ── */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field:last-of-type { margin-bottom: 0; }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .input-wrap { position: relative; }

    input[type="text"],
    input[type="number"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,186,127,.15);
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      padding: 4px;
    }

    .toggle-pw:hover { color: var(--green); }

    input[type="password"] { padding-right: 38px; }

    /* ── Button ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 12px rgba(0,186,127,.35);
    }

    .btn:hover:not(:disabled) {
      background: var(--green-dark);
      box-shadow: 0 6px 16px rgba(0,186,127,.45);
    }

    .btn:active:not(:disabled) { transform: scale(.98); }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn svg { flex-shrink: 0; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-top: 12px;
      line-height: 1.4;
    }

    .error-banner.show { display: block; }

    /* ── Auth code history ── */
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-header .clear-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      transition: color .15s, background .15s;
    }

    .history-header .clear-btn:hover {
      color: var(--danger);
      background: #fef2f2;
    }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-state svg { opacity: .35; margin-bottom: 8px; }

    /* ── Code item ── */
    .code-list { display: flex; flex-direction: column; gap: 12px; }

    .code-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
      animation: slideIn .25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code-item.latest {
      border-color: var(--green);
      background: var(--green-light);
      box-shadow: 0 0 0 3px rgba(0,186,127,.12);
    }

    .code-item .left { display: flex; flex-direction: column; gap: 3px; }

    .code-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .code-item.latest .code-value { color: var(--green-dark); }

    .code-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .latest-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--green);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .copy-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .copy-btn:hover { border-color: var(--green); color: var(--green); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-light); }

    /* ── Footer ── */
    footer {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      padding-bottom: 24px;
    }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      header { padding: 12px 16px; }
      .code-value { font-size: 22px; letter-spacing: 3px; }
    }
  </style>
</head>

    <span class="badge">POS Sandbox</span>
  </header>

  <!-- ── Main ── -->
  <main>
    <div>
      <h1>Driver <span>Auth Code</span> Generator</h1>
      <p class="subtitle">Generate one-time authorization codes for driver fuel payments.</p>
    </div>

    <!-- Config card -->
    <div class="card">
      <p class="card-title">API Configuration</p>

      <div class="field">
        <label for="apiToken">Bearer Token</label>
        <div class="input-wrap">
          <input type="password" id="apiToken"
            value=""
            autocomplete="off" spellcheck="false" />
          <button class="toggle-pw" type="button" aria-label="Toggle token visibility"
            onclick="togglePw()">&#128065;</button>
        </div>
      </div>

      <div class="field">
        <label for="merchantId">Merchant ID</label>
        <input type="text" id="merchantId" value="SID84335" spellcheck="false" />
      </div>

      <div class="field">
        <label for="driverId">Driver ID</label>
        <input type="number" id="driverId" value="253169" min="1" />
      </div>
    </div>

    <!-- Generate button -->
    <button class="btn" id="genBtn" onclick="generateCode()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Generate Driver Auth Code
    </button>

    <!-- Error banner -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- History card -->
    <div class="card">
      <div class="history-header">
        <p class="card-title" style="margin-bottom:0">Recent Auth Codes</p>
        <button class="clear-btn" onclick="clearHistory()">Clear</button>
      </div>

      <div style="margin-top:16px" id="historyContainer">
        <div class="empty-state" id="emptyState">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <p>No codes generated yet.</p>
          <p style="margin-top:4px;color:#94a3b8">Hit the button above to create one.</p>
        </div>
        <div class="code-list" id="codeList"></div>
      </div>
    </div>
  </main>

  <footer>Mudflap Staging Sandbox &middot; Codes are single-use</footer>

  <script>
    const STAGING_URL = 'https://staging.sandbox.mudflapinc.com/pos/api/v1/authorizations/codes';
    const API_URL     = 'https://corsproxy.io/?url=' + encodeURIComponent(STAGING_URL);

    const MAX_HISTORY = 3;

    let history = [];

    function togglePw() {
      const inp = document.getElementById('apiToken');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorBanner').classList.remove('show');
    }

    function setLoading(on) {
      const btn = document.getElementById('genBtn');
      if (on) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Generating…';
      } else {
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Generate Driver Auth Code`;
      }
    }

    async function generateCode() {
      hideError();

      const token      = document.getElementById('apiToken').value.trim();
      const merchantId = document.getElementById('merchantId').value.trim();
      const driverId   = parseInt(document.getElementById('driverId').value.trim(), 10);

      if (!token)             { showError('Bearer token is required.'); return; }
      if (!merchantId)        { showError('Merchant ID is required.'); return; }
      if (!driverId || driverId < 1) { showError('A valid Driver ID is required.'); return; }

      setLoading(true);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({
            authorization: {
              total:       1,
              merchant_id: merchantId,
              driver_id:   driverId,
            },
          }),
        });

        if (!res.ok) {
          let detail = '';
          try { const j = await res.json(); detail = j.message || j.error || JSON.stringify(j); } catch (_) {}
          throw new Error(`HTTP ${res.status}${detail ? ': ' + detail : ''}`);
        }

        const data = await res.json();
        const codes = data.codes;

        if (!Array.isArray(codes) || codes.length === 0) {
          throw new Error('Unexpected response — no codes returned.');
        }

        const entry = { code: codes[0], ts: new Date() };
        history.unshift(entry);
        if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);

        renderHistory();
      } catch (err) {
        showError('Request failed: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }

    function copyCode(code, btn) {
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        btn.textContent = '✓ Copied';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
        }, 2000);
      });
    }

    function formatTs(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        + ' · ' + date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderHistory() {
      const list  = document.getElementById('codeList');
      const empty = document.getElementById('emptyState');

      if (history.length === 0) {
        list.innerHTML  = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      list.innerHTML = history.map((entry, i) => `
        <div class="code-item ${i === 0 ? 'latest' : ''}">
          <div class="left">
            <div class="code-value">${entry.code}</div>
            <div class="code-meta">
              ${i === 0 ? '<span class="latest-badge">&#9679; Latest</span>' : ''}
              ${formatTs(entry.ts)}
            </div>
          </div>
          <button class="copy-btn" onclick="copyCode('${entry.code}', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      `).join('');
    }

    // Init
    renderHistory();
  </script>
</body>
</html>
